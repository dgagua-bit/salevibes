<main id="main">
<div class="wrap">
  <div class="page-head"><p class="eyebrow">მაღაზიები</p><h1>საერთაშორისო მაღაზიები</h1><p>თითოეულ მაღაზიასთან ჩანს, საიდან მოდის მონაცემი: <span class="tag auto">AUTO</span> — სკანერი ავტომატურად ამოწმებს პროდუქტების ფასს, <span class="tag">MANUAL</span> — აქციას რედაქცია ხელით ამოწმებს, <span class="tag off">PENDING</span> — ინტეგრაცია ჯერ არ არის.</p></div>
  <div class="results-bar"><label class="field" style="flex:1;max-width:420px">ძიება<input id="s-q" type="search" placeholder="მაღაზია, ქვეყანა, კატეგორია, ბრენდი…"></label>
